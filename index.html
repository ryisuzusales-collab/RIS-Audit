<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18222E">
<title>ตรวจสอบภายใน RIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --card:#FFFFFF; --ink:#18222E; --muted:#5B6876; --line:#D5DCE3; --soft:#F6F8FA;
  --brand:#B5121B; --pass:#1E7A4C; --obs:#A3650A; --fail:#B5121B; --na:#7A8591;
  --pass-bg:#E6F3EC; --obs-bg:#FBF0DD; --fail-bg:#FBE7E8; --na-bg:#EEF0F2;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#11171D; --card:#1A222B; --ink:#E7ECF1; --muted:#9AA6B2; --line:#2C3743; --soft:#212B35;
    --brand:#E5484D; --pass:#4CC38A; --obs:#F0B44C; --fail:#F2666B; --na:#9AA6B2;
    --pass-bg:#16301F; --obs-bg:#3A2B12; --fail-bg:#3B1A1C; --na-bg:#242D36;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "IBM Plex Sans Thai","Sarabun","Leelawadee UI",Tahoma,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){.bar{background:#0B1015}}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:54px}
.bar h1{font-size:17px;font-weight:600;margin:0;flex:1;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar h1 small{display:block;font-size:12px;font-weight:400;opacity:.7}
.back{background:none;border:0;color:#fff;font-size:22px;width:36px;height:36px;margin-left:-8px;border-radius:8px}
.sync{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap;border:0;color:#fff}
.sync.wait{background:#A3650A}
.sync.err{background:#B5121B}

.line-tip{background:var(--obs-bg);color:var(--ink);font-size:13px;padding:8px 14px;text-align:center}
.line-tip a{color:var(--brand);font-weight:600}

h2{font-size:20px;margin:22px 0 10px;font-weight:600;line-height:1.35}
h3{font-size:15px;margin:22px 0 8px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:5px 10px;font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:500;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:9px 11px}
textarea.t{min-height:64px;resize:vertical}

/* tabs & chips */
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;margin:14px 0}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:7px 4px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 0 var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* risk score square */
.risk{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 5px;border-radius:6px;font-weight:700;font-size:14px;line-height:1;font-variant-numeric:tabular-nums;vertical-align:middle}
.risk.hi{background:var(--fail);color:#fff}
.risk.mid{background:var(--obs);color:#fff}
.risk.lo{background:var(--pass);color:#fff}
.risk.un{background:var(--soft);color:var(--muted);border:1px dashed var(--line)}
.risk.big{min-width:56px;height:56px;font-size:26px;border-radius:10px}

/* round cards */
.round{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.round .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.round b{font-size:17px}
.prog{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin:8px 0 6px;display:flex}
.prog i{display:block;height:100%}
.prog .p{background:var(--pass)} .prog .o{background:var(--obs)} .prog .x{background:var(--fail)} .prog .n{background:var(--na)}
.tally{display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tally .p{color:var(--pass)} .tally .o{color:var(--obs)} .tally .x{color:var(--fail)}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.done{background:var(--pass-bg);color:var(--pass);border-color:transparent}
.tag.hi{background:var(--fail-bg);color:var(--fail);border-color:transparent}
.tag.law{background:var(--ink);color:var(--card);border-color:transparent}

/* stage list */
.group{margin-top:18px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.group-h b{font-size:16px}
.stage{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:6px}
.stage .go{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.stage .go span{display:block}
.stage .ring{width:38px;height:38px;flex:none}
.info{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--muted);font-weight:700;font-size:15px;font-family:Georgia,serif;font-style:italic}
.who{font-size:12px;color:var(--muted)}
.who.me{color:var(--brand);font-weight:600}

/* items */
.topic{margin:22px 0 8px;font-weight:600;font-size:15px}
.item{position:relative;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 13px;margin-bottom:8px}
.item.lv-hi{border-left-color:var(--fail)} .item.lv-mid{border-left-color:var(--obs)} .item.lv-lo{border-left-color:var(--pass)}
.item .txt{display:block;width:100%;text-align:left;background:none;border:0;padding:0 74px 0 0;font-weight:500;min-height:24px}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stamp{position:absolute;top:10px;right:10px;font-size:13px;font-weight:700;padding:1px 8px;border:2px double currentColor;border-radius:6px;transform:rotate(-7deg);background:var(--card)}
.stamp.pass{color:var(--pass)} .stamp.obs{color:var(--obs)} .stamp.fail{color:var(--fail)} .stamp.na{color:var(--na)}
@media (prefers-reduced-motion:no-preference){.stamp.new{animation:thud .28s ease-out}}
@keyframes thud{0%{transform:rotate(-7deg) scale(1.6);opacity:0}70%{transform:rotate(-7deg) scale(.94);opacity:1}100%{transform:rotate(-7deg) scale(1)}}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.res button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 2px;font-size:13.5px;font-weight:500}
.res button.on.pass{background:var(--pass);border-color:var(--pass);color:#fff}
.res button.on.obs{background:var(--obs);border-color:var(--obs);color:#fff}
.res button.on.fail{background:var(--fail);border-color:var(--fail);color:#fff}
.res button.on.na{background:var(--na);border-color:var(--na);color:#fff}
.more{margin-top:8px;display:none}
.item.open .more{display:block}
.more .two{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.foot{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.foot .pend{color:var(--obs)}
.need{color:var(--fail);font-size:12px}

/* popup (bottom sheet on phones) */
dialog.sheet{border:0;padding:0;width:100%;max-width:640px;max-height:88vh;margin:auto auto 0;border-radius:16px 16px 0 0;background:var(--card);color:var(--ink);box-shadow:0 -6px 30px rgba(0,0,0,.25)}
dialog.sheet[open]{display:flex;flex-direction:column}
dialog.sheet::backdrop{background:rgba(10,15,20,.55)}
@media (min-width:700px){dialog.sheet{margin:auto;border-radius:14px;max-height:84vh}}
@media (prefers-reduced-motion:no-preference){dialog.sheet[open]{animation:up .2s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;gap:10px;align-items:flex-start;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.sh-h .t{flex:1;min-width:0}
.sh-h .t small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.sh-h .t b{display:block;font-size:17px;line-height:1.4;margin-top:2px}
.sh-x{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);font-size:18px;line-height:1}
.sh-b{overflow-y:auto;padding:4px 14px 16px;-webkit-overflow-scrolling:touch}
.sh-f{border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.sh-f .res{margin-top:0}
.sec{margin-top:14px}
.sec h4{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--muted)}
.sec p{margin:0}
ol.steps{margin:0;padding-left:22px}
ol.steps li{margin:3px 0}
ul.plain{margin:0;padding-left:18px}
.scorebox{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:12px}
.scorebox .calc{font-size:13.5px;line-height:1.5}
.scorebox .calc b{font-size:15px}
.plist button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 0}
.plist button:last-child{border-bottom:0}
.plist .k{font-size:12px;color:var(--muted);display:block}

/* report */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.kpi b{display:block;font-size:22px;line-height:1.2}
.score-big{font-size:44px;font-weight:700;line-height:1}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:var(--card)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font-weight:600;color:var(--muted);font-size:13px}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.find{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;break-inside:avoid}
.find .h{display:flex;gap:10px;align-items:flex-start}
.find .h b{flex:1}

/* settings */
.gear{background:none;border:0;color:#fff;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;margin-right:-6px}
.gear svg{width:22px;height:22px}
.adm-bar{display:grid;grid-template-columns:1fr;gap:8px;margin-top:4px}
@media (min-width:560px){.adm-bar{grid-template-columns:1.3fr 1fr}}
.adm-list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;margin-top:8px}
.adm-list .topic{margin:14px 0 2px;font-size:13px;color:var(--muted)}
.adm-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0}
.adm-item:last-child{border-bottom:0}
.adm-item .k{display:block;font-size:12px;color:var(--muted)}
.adm-item.off{opacity:.5}
.adm-item.off .t1{text-decoration:line-through}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .three{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.check{display:flex;gap:8px;align-items:center;font-size:14px;padding:9px 0}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.preview{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13.5px;color:var(--muted)}
.btn.danger{color:var(--fail);border-color:var(--fail)}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:10px}

.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 16px;border-radius:9px;font-size:14px;z-index:60;max-width:90vw}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:15}
.hide{display:none!important}

@media print{
  body{background:#fff;color:#000;padding:0}
  .bar,.bottom,.noprint,.line-tip,dialog{display:none!important}
  .find,.kpi div,.tbl{border-color:#bbb}
  .risk{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="lineTip" class="line-tip hide">เปิดจากแอป LINE อยู่ — <a id="lineLink" href="#">เปิดในเบราว์เซอร์</a> จะบันทึกได้เสถียรกว่า</div>
<header class="bar"><div class="wrap">
  <button class="back hide" id="backBtn" aria-label="ย้อนกลับ">‹</button>
  <h1 id="title">ตรวจสอบภายใน RIS</h1>
  <button class="sync hide" id="syncBtn" title="สถานะการบันทึก"></button>
  <button class="gear hide" id="gearBtn" aria-label="ตั้งค่า" title="ตั้งค่า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>
<main class="wrap" id="app"></main>
<div class="bottom hide" id="bottom"><div class="wrap" id="bottomInner"></div></div>
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"></dialog>

<script>
/* ============ ตั้งค่า ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbztihj-mqNwIkgozjII4XXeOQ-TOKFiu2y2eT2xXmU3AnrRBTK5ErlfIPcYSx1_7tsGug/exec';   // URL Web App ของ Apps Script (ลงท้าย /exec)
const POLL_MS = 30000;
/* ================================= */

const RES = [
  {v:'ผ่าน', c:'pass'}, {v:'ข้อสังเกต', c:'obs'}, {v:'ไม่ผ่าน', c:'fail'}, {v:'ไม่เกี่ยวข้อง', c:'na'}
];
const RC = Object.fromEntries(RES.map(r => [r.v, r.c]));
const LV = {'มาก':'hi','ปานกลาง':'mid','น้อย':'lo'};
const LIK = ['', 'น้อย', 'ปานกลาง', 'มาก'];

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const S = {
  cfg: LS.get('ris_cfg', {api: API_URL, pin:'', user:''}),
  data: LS.get('ris_data', null),
  queue: LS.get('ris_queue', []),
  view: 'login', tab: 'rounds',
  round: null, results: {}, claims: {},
  stage: null, filter: 'all', stageFilter: 'all',
  openItem: null, justStamped: null, syncing: false, syncErr: false,
  sheetItem: null,
  adminPin: '', admin: null, setTab: 'items', setStage: null, setQuery: ''
};
if (API_URL) S.cfg.api = API_URL;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thDate = d => { if(!d) return ''; const x = new Date(String(d).length <= 10 ? d + 'T00:00:00' : d); return isNaN(x) ? d : x.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}); };
const thTime = d => { const x = new Date(d); return isNaN(x) ? '' : x.toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

async function api(action, params = {}){
  if (!S.cfg.api) throw new Error('ยังไม่ได้ตั้ง URL ของ Apps Script');
  const q = new URLSearchParams({action, pin: S.cfg.pin, user: S.cfg.user, ...params});
  const r = await fetch(S.cfg.api + '?' + q.toString(), {redirect:'follow'});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'เซิร์ฟเวอร์ตอบกลับผิดพลาด');
  return j.data;
}

/* เมนูตั้งค่าส่ง POST แบบ text/plain (ข้อความยาวเกิน URL) ถ้าเครือข่ายไม่ยอม ถอยไปใช้ GET */
async function apiPost(action, extra = {}){
  const payload = {action, pin: S.cfg.pin, user: S.cfg.user, adminPin: S.adminPin, ...extra};
  let j;
  try {
    const r = await fetch(S.cfg.api, {method:'POST', body: JSON.stringify(payload), redirect:'follow'});
    j = await r.json();
  } catch (e) {
    const q = new URLSearchParams(Object.fromEntries(Object.entries(payload).map(([k,v]) => [k, typeof v === 'object' ? JSON.stringify(v) : v])));
    const r = await fetch(S.cfg.api + '?' + q.toString(), {redirect:'follow'});
    j = await r.json();
  }
  if (!j.ok) throw new Error(j.error || 'เซิร์ฟเวอร์ตอบกลับผิดพลาด');
  return j.data;
}

/* ---------- derived helpers ---------- */
const items = () => S.data?.items || [];
const itemById = id => items().find(i => i.id === id);
const stageObj = code => { for (const g of S.data.groups) for (const s of g.stages) if (s.code === code) return s; return {code, name:code}; };
const stageName = code => stageObj(code).name;
const itemsOfStage = code => items().filter(i => i.stage === code);
const defW = () => S.data?.scoring?.defaultWeight ?? 3;
const weightOf = i => i.weight || i.score || defW();
function tally(list){
  const t = {total:list.length, done:0, pass:0, obs:0, fail:0, na:0, highFail:0, w:0, wGot:0};
  list.forEach(i => { const r = S.results[i.id]?.result; if(!r) return; t.done++;
    if (r === 'ไม่เกี่ยวข้อง'){ t.na++; return; }
    const w = weightOf(i); t.w += w;
    if (r === 'ผ่าน'){ t.pass++; t.wGot += w; }
    else if (r === 'ข้อสังเกต'){ t.obs++; t.wGot += w / 2; }
    else if (r === 'ไม่ผ่าน'){ t.fail++; if (i.level === 'มาก') t.highFail++; } });
  return t;
}
const score = t => t.w ? Math.round(t.wGot / t.w * 100) : null;
const pct = n => n === null ? '–' : n + '%';
function progBar(t){
  const w = n => t.total ? (n / t.total * 100) + '%' : '0';
  return `<div class="prog" role="img" aria-label="ตรวจแล้ว ${t.done} จาก ${t.total}"><i class="p" style="width:${w(t.pass)}"></i><i class="o" style="width:${w(t.obs)}"></i><i class="x" style="width:${w(t.fail)}"></i><i class="n" style="width:${w(t.na)}"></i></div>`;
}
function ring(done, total){
  const r = 15, c = 2 * Math.PI * r, p = total ? done / total : 0;
  const col = p >= 1 ? 'var(--pass)' : 'var(--ink)';
  return `<svg class="ring" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="19" cy="19" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 19 19)" stroke-linecap="round"/><text x="19" y="23" text-anchor="middle" font-size="10" fill="var(--muted)">${done}</text></svg>`;
}
function riskBox(i, big){
  if (i.kind !== 'จุดเสี่ยง') return '';
  const cls = i.level ? LV[i.level] : 'un';
  return `<span class="risk ${cls} ${big ? 'big' : ''}" title="คะแนนความเสี่ยง">${i.score || '–'}</span>`;
}
function riskLabel(i){
  if (i.kind !== 'จุดเสี่ยง') return '<span class="tag">หัวข้อตรวจ</span>';
  return (i.level ? `เสี่ยง${esc(i.level)}` : 'ยังไม่ประเมินความเสี่ยง') + (i.legal ? ' <span class="tag law">กฎหมาย</span>' : '');
}

/* ---------- offline queue ---------- */
function enqueue(rec){
  S.queue = S.queue.filter(q => !(q.round === rec.round && q.item === rec.item));
  S.queue.push(rec); LS.set('ris_queue', S.queue); updateSync(); flush();
}
async function flush(){
  if (S.syncing || !S.queue.length) return;
  S.syncing = true; updateSync();
  while (S.queue.length){
    const rec = S.queue[0];
    try { await api('save', rec); S.queue.shift(); S.syncErr = false; LS.set('ris_queue', S.queue); }
    catch(e){ S.syncErr = true; break; }
  }
  S.syncing = false; updateSync();
  if (S.syncErr) setTimeout(flush, 15000);
}
const pendingKeys = () => new Set(S.queue.map(q => q.round + '|' + q.item));
function updateSync(){
  const b = $('#syncBtn'); if (S.view === 'login'){ b.classList.add('hide'); return; }
  b.classList.remove('hide','wait','err');
  if (S.queue.length){ b.classList.add(S.syncErr ? 'err' : 'wait'); b.textContent = (S.syncErr ? 'ออฟไลน์ ' : 'กำลังส่ง ') + S.queue.length; }
  else b.textContent = 'บันทึกแล้ว';
}
window.addEventListener('online', flush);

/* ---------- data loading ---------- */
async function loadInit(){
  const d = await api('init');
  S.data = d; LS.set('ris_data', d);
}
async function loadRound(silent){
  if (!S.round) return;
  try{
    const d = await api('round', {round: S.round.round_id});
    const pend = pendingKeys(); const local = S.results;
    S.results = {};
    d.results.forEach(r => S.results[r.item_id] = r);
    Object.values(local).forEach(r => { if (pend.has(S.round.round_id + '|' + r.item_id)) S.results[r.item_id] = r; });
    S.claims = {}; d.claims.forEach(c => S.claims[c.stage] = c.auditor);
    LS.set('ris_round_' + S.round.round_id, {results:S.results, claims:S.claims});
    if (silent && S.openItem) return;
    render();
  }catch(e){ if(!silent) toast(e.message); }
}
let pollT = null;
function startPoll(){ stopPoll(); pollT = setInterval(() => { if (document.visibilityState === 'visible') loadRound(true); }, POLL_MS); }
function stopPoll(){ clearInterval(pollT); }

/* ---------- navigation ---------- */
function go(view, extra = {}){
  Object.assign(S, extra, {view});
  if (view === 'round' || view === 'stage') startPoll(); else stopPoll();
  render(); window.scrollTo(0,0);
}
$('#backBtn').onclick = () => {
  if (S.view === 'stage' || S.view === 'report') go('round', {openItem:null});
  else if (S.view === 'round') { refreshRounds(); go('home'); }
  else if (S.view === 'settings') { go('home'); loadInit().then(() => { if (S.view === 'home') render(); }).catch(() => {}); }
};
$('#gearBtn').onclick = () => openSettings();
$('#syncBtn').onclick = () => { if (S.queue.length) flush(); else toast('ทุกอย่างบันทึกลงชีตแล้ว'); };

/* ---------- views ---------- */
function render(){
  const app = $('#app'), back = $('#backBtn'), title = $('#title');
  $('#bottom').classList.add('hide'); back.classList.toggle('hide', !['round','stage','report','settings'].includes(S.view));
  $('#gearBtn').classList.toggle('hide', S.view !== 'home');
  updateSync();
  if (S.view === 'login') { title.innerHTML = 'ตรวจสอบภายใน RIS'; app.innerHTML = vLogin(); return; }
  if (S.view === 'settings') { title.innerHTML = 'ตั้งค่า<small>สิ่งที่ต้องตรวจ ขั้นตอน และสาขา</small>'; app.innerHTML = vSettings(); renderAdmList(); return; }
  if (S.view === 'home') { title.innerHTML = `ตรวจสอบภายใน RIS<small>${esc(S.cfg.user)}</small>`; app.innerHTML = vHome(); return; }
  const rd = S.round;
  if (S.view === 'round') { title.innerHTML = `สาขา${esc(rd.branch)}<small>รอบตรวจ ${thDate(rd.date)}</small>`; app.innerHTML = vRound(); return; }
  if (S.view === 'stage') { title.innerHTML = `${esc(stageName(S.stage))}<small>สาขา${esc(rd.branch)} ${thDate(rd.date)}</small>`; app.innerHTML = vStage(); renderStageBottom(); return; }
  if (S.view === 'report') { title.innerHTML = `รายงานผลตรวจ<small>สาขา${esc(rd.branch)} ${thDate(rd.date)}</small>`; app.innerHTML = vReport(); return; }
}

function stageSheet(code){
  const s = stageObj(code); const list = itemsOfStage(code);
  const docs = [...new Set(list.map(i => i.docs).filter(Boolean))];
  const risks = list.filter(i => i.kind === 'จุดเสี่ยง');
  const hi = risks.filter(i => i.level === 'มาก').length;
  const sorted = [...list].sort((a,b) => (a.kind === b.kind ? 0 : a.kind === 'หัวข้อตรวจ' ? -1 : 1) || (b.score||0) - (a.score||0));
  const body = `${s.desc ? `<p style="margin:12px 0 0">${esc(s.desc)}</p>` : ''}
    <p class="small muted" style="margin:4px 0 0">${list.length} ข้อ: หัวข้อตรวจ ${list.length - risks.length} · จุดเสี่ยง ${risks.length}${hi ? ` (เสี่ยงมาก ${hi})` : ''}</p>
    ${docs.length ? `<div class="sec"><h4>เอกสารที่ต้องใช้</h4><ul class="plain">${docs.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>` : ''}
    ${(s.reports||[]).length ? `<div class="sec"><h4>รายงานที่ควรเตรียม</h4><ul class="plain">${s.reports.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>` : ''}

const adm = () => S.admin || {items:[], groups:[], branches:[]};
const admStages = () => adm().groups.flatMap(g => g.stages.map(s => ({...s, group:g.code, groupName:g.name})));
const admStage = code => admStages().find(s => s.code === code) || {code, name:code};
const admScore = (lik, sev, legal) => { const sc = S.data?.scoring || {legalBonus:5, high:6, mid:3};
  const s = lik * sev + (legal ? sc.legalBonus : 0);
  return {score:s, level: s === 0 ? '' : s >= sc.high ? 'มาก' : s >= sc.mid ? 'ปานกลาง' : 'น้อย'}; };

function updatePreview(){

function readItemForm(){
  const id = $('#itemForm').dataset.id;
  const data = {id: id || undefined, kind: $('#fKind').value, method: $('#fMethod').value, stage: $('#fStage').value,
    topic: $('#fTopic').value.trim(), text: $('#fText').value.trim(), howto: $('#fHow').value.trim(), docs: $('#fDocs').value.trim(),
    sample: $('#fSample').value.trim(), lik: +$('#fLik').value, sev: +$('#fSev').value, legal: $('#fLegal').checked,
    impact: $('#fImpact').value.trim(), action: $('#fAction').value.trim(), active: $('#fActive').checked};
  if (data.kind !== 'จุดเสี่ยง') Object.assign(data, {lik:0, sev:0, legal:false});
  if (!id) {   // วางต่อจากข้อสุดท้ายที่หัวข้อเดียวกัน เพื่อให้เรียงอยู่ด้วยกันในชีต
    const same = adm().items.filter(x => x.stage === data.stage);
    const t = same.filter(x => x.topic === data.topic);
    const ref = (t.length ? t : same)[(t.length ? t : same).length - 1];
    if (ref) data.after = ref.id;
  }
  return data;
}

    <div class="adm-list">${g.stages.map(s => { const n = adm().items.filter(i => i.stage === s.code && i.active).length;
      return `<button class="adm-item" data-editstage="${s.code}"><span class="risk un">${n}</span><span><span>${esc(s.name)}</span><span class="k">${esc(s.desc || 'ยังไม่มีคำอธิบาย')}</span></span></button>`; }).join('') || '<div class="empty" style="padding:16px">ยังไม่มีขั้นตอน</div>'}</div>
    <div style="margin-top:8px"><button class="btn sm" data-addstage="${g.code}">+ เพิ่มขั้นตอนในกลุ่มนี้</button></div></section>`).join('');
  return g + `<div style="margin-top:20px"><button class="btn" data-addgroup="1">+ เพิ่มกลุ่มใหม่</button></div>
    <p class="note">ตัวเลขคือจำนวนข้อที่ใช้งานในขั้นตอนนั้น ลบขั้นตอนได้เมื่อไม่มีข้อตรวจเหลืออยู่</p>`;
}
function stageForm(code, group){
  const s = code ? admStage(code) : {name:'', desc:'', reports:[], group};
  const gOpt = adm().groups.map(g => `<option value="${g.code}" ${g.code===s.group?'selected':''}>${esc(g.name)}</option>`).join('');
  openSheet(`<small>${code ? 'แก้ไขขั้นตอน' : 'เพิ่มขั้นตอน'}</small><b>${esc(s.name || 'ขั้นตอนใหม่')}</b>`, `<form class="form" id="stageForm" data-code="${esc(code || '')}">
    <label class="f" for="sName">ชื่อขั้นตอน *</label><input class="t" id="sName" value="${esc(s.name)}" required>
    <label class="f" for="sGroup">อยู่ในกลุ่ม</label><select class="t" id="sGroup">${gOpt}</select>
    <label class="f" for="sDesc">คำอธิบายสั้น ๆ (แสดงในปุ่ม i)</label><input class="t" id="sDesc" value="${esc(s.desc)}">
    <label class="f" for="sRep">รายงานที่ควรเตรียม (บรรทัดละรายงาน)</label><textarea class="t" id="sRep" style="min-height:90px">${esc((s.reports||[]).join('\n'))}</textarea>
  </form>`, `<div class="row" style="justify-content:space-between;flex-wrap:nowrap">
    ${code ? '<button class="btn danger" data-delstage="1">ลบขั้นตอน</button>' : '<span></span>'}
    <button class="btn primary" data-savestage="1" style="min-width:120px">บันทึก</button></div>`);
}
function groupForm(code){
  const g = code ? adm().groups.find(x => x.code === code) : {name:''};
  openSheet(`<small>${code ? 'แก้ไขกลุ่ม' : 'เพิ่มกลุ่ม'}</small><b>${esc(g.name || 'กลุ่มใหม่')}</b>`, `<form class="form" id="groupForm" data-code="${esc(code || '')}">
    <label class="f" for="gName">ชื่อกลุ่ม *</label><input class="t" id="gName" value="${esc(g.name)}" required></form>`,
    `<div class="row" style="justify-content:space-between;flex-wrap:nowrap">
    ${code ? '<button class="btn danger" data-delgroup="1">ลบกลุ่ม</button>' : '<span></span>'}
    <button class="btn primary" data-savegroup="1" style="min-width:120px">บันทึก</button></div>`);
}
function vSetBranches(){
  return `<div class="panel" style="margin-top:4px">
    <label class="f" for="brList" style="margin-top:0">รายชื่อสาขา (บรรทัดละสาขา)</label>
    <textarea class="t" id="brList" style="min-height:140px">${esc(adm().branches.join('\n'))}</textarea>
    <div style="margin-top:10px"><button class="btn primary" data-savebranches="1">บันทึกรายชื่อสาขา</button></div></div>
    <p class="note">รอบตรวจเดิมของสาขาที่เอาออกยังอยู่ในประวัติ</p>`;
}

/* ---------- actions ---------- */
async function openRound(id){
  const r = S.data.rounds.find(x => x.round_id === id) || {round_id:id, branch:id.split('-').slice(1).join('-'), date:id.slice(0,4)+'-'+id.slice(4,6)+'-'+id.slice(6,8), status:'กำลังตรวจ'};
  const cached = LS.get('ris_round_' + id, null);
  S.results = cached?.results || {}; S.claims = cached?.claims || {};
  go('round', {round:r, filter:'all'});
  loadRound();
  loadInit().then(() => { if (S.view === 'round') render(); }).catch(() => {});   // รับรายการตรวจที่แก้จากเมนูตั้งค่า
}
function setResult(itemId, patch){
  const prev = S.results[itemId] || {item_id:itemId};
  const rec = {...prev, ...patch, item_id:itemId, auditor:S.cfg.user, updated_at:new Date().toISOString()};
  S.results[itemId] = rec;
  enqueue({round:S.round.round_id, item:itemId, result:rec.result || '', note:rec.note || '', sample:rec.sample || '', link:rec.link || ''});
}
function applyResult(id, val){
  const cur = S.results[id]?.result;
  const v = cur === val ? '' : val;
  setResult(id, {result:v});
  S.justStamped = v ? id : null;
  if (v === 'ไม่ผ่าน' || v === 'ข้อสังเกต') S.openItem = id;
  render();
  if (S.openItem === id && v && !S.results[id].note) setTimeout(() => document.querySelector(`.item[data-item="${CSS.escape(id)}"] textarea`)?.focus(), 60);
}
async function claim(stage, user){
  S.claims[stage] = user; render();
  try { await api('claim', {round:S.round.round_id, stage, user}); toast(user ? 'รับตรวจส่วนนี้แล้ว' : 'ปล่อยส่วนนี้แล้ว'); }
  catch(e){ toast(e.message); loadRound(); }
}

document.addEventListener('submit', async e => {
  if (e.target.id === 'adminForm'){
    e.preventDefault();
    const val = $('#adminPinIn').value.trim(); const btn = $('#adminGo'); btn.disabled = true;
    try { S.adminPin = val; await apiPost('adminCheck'); await loadAdmin(); closeSheet(); go('settings'); }
    catch (err){ S.adminPin = ''; btn.disabled = false; toast(err.message); $('#adminPinIn').select(); }
    return;
  }
  if (['itemForm','stageForm','groupForm'].includes(e.target.id)) { e.preventDefault(); return; }
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  S.cfg.user = $('#u').value.trim(); S.cfg.pin = $('#p').value.trim();
  if (!API_URL) S.cfg.api = $('#a').value.trim();
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'กำลังโหลดรายการตรวจ...';
  try { await loadInit(); LS.set('ris_cfg', S.cfg); go('home'); flush(); }
  catch(err){ btn.disabled = false; btn.textContent = 'เข้าใช้งาน'; toast(err.message === 'Failed to fetch' ? 'เชื่อมต่อ Apps Script ไม่ได้ ตรวจ URL และการ Deploy' : err.message); }
});

document.addEventListener('click', async e => {
  const t = e.target.closest('button, a'); if (!t) return;
  const d = t.dataset;
  if (d.close){ closeSheet(); return; }
  /* settings */
  if (d.settab){ S.setTab = d.settab; render(); return; }
  if (d.edit){ itemForm(d.edit); return; }
  if (d.additem){ itemForm(null); return; }
  if (d.saveitem){
    const data = readItemForm();
    if (!data.text) { toast('ใส่ข้อความสิ่งที่ตรวจก่อน'); $('#fText').focus(); return; }
    if (await admSave('saveItem', {data}, data.id ? 'บันทึกการแก้ไขแล้ว' : 'เพิ่มสิ่งที่ต้องตรวจแล้ว')) { if (!data.id) S.setStage = data.stage; render(); }
    return;
  }
  if (d.delitem){
    if (!confirm('ลบข้อนี้ถาวร? ถ้าแค่ไม่ต้องตรวจแล้ว ให้เอาเครื่องหมาย "ใช้งานข้อนี้" ออกแทน')) return;
    admSave('deleteItem', {id: $('#itemForm').dataset.id}, 'ลบแล้ว'); return;
  }
  if (d.editstage){ stageForm(d.editstage); return; }
  if (d.addstage){ stageForm(null, d.addstage); return; }
  if (d.savestage){
    const data = {code: $('#stageForm').dataset.code || undefined, name: $('#sName').value.trim(), group: $('#sGroup').value,
      desc: $('#sDesc').value.trim(), reports: $('#sRep').value.split('\n').map(s => s.trim()).filter(Boolean)};
    if (!data.name) { toast('ใส่ชื่อขั้นตอนก่อน'); return; }
    admSave('saveStage', {data}, 'บันทึกขั้นตอนแล้ว'); return;
  }
  if (d.delstage){ if (!confirm('ลบขั้นตอนนี้?')) return; admSave('deleteStage', {code: $('#stageForm').dataset.code}, 'ลบขั้นตอนแล้ว'); return; }
  if (d.editgroup){ groupForm(d.editgroup); return; }
  if (d.addgroup){ groupForm(null); return; }
  if (d.savegroup){
    const data = {code: $('#groupForm').dataset.code || undefined, name: $('#gName').value.trim()};
    if (!data.name) { toast('ใส่ชื่อกลุ่มก่อน'); return; }
    admSave('saveGroup', {data}, 'บันทึกกลุ่มแล้ว'); return;
  }
  if (d.delgroup){ if (!confirm('ลบกลุ่มนี้?')) return; admSave('deleteGroup', {code: $('#groupForm').dataset.code}, 'ลบกลุ่มแล้ว'); return; }
  if (d.savebranches){
    const list = $('#brList').value.split('\n').map(s => s.trim()).filter(Boolean);
    t.disabled = true;
    try { await apiPost('saveBranches', {data: list}); await loadAdmin(); render(); toast('บันทึกรายชื่อสาขาแล้ว'); }
    catch (err){ toast(err.message); t.disabled = false; }
    return;
  }
  if (d.detail){ itemSheet(d.detail); return; }
  if (d.info){ stageSheet(d.info); return; }
  if (d.howscore){ scoreSheet(); return; }
  if (d.sheetset){ const id = S.sheetItem; closeSheet(); applyResult(id, d.sheetset); return; }
  if (d.tab){ S.tab = d.tab; render(); return; }
  if (d.round){ e.preventDefault(); openRound(d.round); return; }
  if (d.filter){ S.filter = d.filter; render(); return; }
  if (d.sfilter){ S.stageFilter = d.sfilter; S.openItem = null; render(); return; }
  if (d.stage){ closeSheet(); go('stage', {stage:d.stage, stageFilter:'all', openItem:null}); return; }
  if (d.claim){ claim(d.claim, S.cfg.user); return; }
  if (d.unclaim){ claim(d.unclaim, ''); return; }
  if (t.id === 'backRound'){ go('round'); return; }
  if (t.id === 'toReport'){ go('report'); return; }
  if (t.id === 'reload'){ try { await loadInit(); } catch(err){} loadRound(); toast('ดึงข้อมูลล่าสุดแล้ว'); return; }
  if (t.id === 'toggleStatus'){
    const st = S.round.status === 'ปิดรอบแล้ว' ? 'กำลังตรวจ' : 'ปิดรอบแล้ว';
    if (st === 'ปิดรอบแล้ว' && !confirm('ปิดรอบตรวจนี้? ยังแก้ผลได้ภายหลัง')) return;
    try { await api('setStatus', {round:S.round.round_id, status:st}); S.round.status = st; render(); toast(st); } catch(err){ toast(err.message); }
    return;
  }
  if (t.id === 'newRound'){
    t.disabled = true;
    try {
      const r = await api('createRound', {branch:$('#nb').value, date:$('#nd').value});
      S.data.rounds = await api('rounds'); LS.set('ris_data', S.data);
      if (r.existed) toast('มีรอบนี้อยู่แล้ว พาเข้ารอบเดิม');
      openRound(r.round_id);
    } catch(err){ toast(err.message); t.disabled = false; }
    return;
  }
  const art = t.closest('.item');
  if (art){
    const id = art.dataset.item;
    if (d.set){ applyResult(id, d.set); return; }
    if (d.toggle){ S.openItem = S.openItem === id ? null : id; render(); return; }
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'admStage'){ S.setStage = e.target.value; S.setQuery = ''; const q = $('#admQ'); if (q) q.value = ''; renderAdmList(); return; }
  if (e.target.closest('#itemForm')) updatePreview();
});
let typeT = null;
document.addEventListener('input', e => {
  if (e.target.id === 'admQ'){ S.setQuery = e.target.value; renderAdmList(); return; }
  const f = e.target.dataset.field; if (!f) return;
  const id = e.target.closest('.item').dataset.item;
  S.results[id] = {...(S.results[id] || {item_id:id}), [f]: e.target.value};
  clearTimeout(typeT);
  typeT = setTimeout(() => setResult(id, {[f]: e.target.value}), 700);
});

/* ---------- boot ---------- */
(function boot(){
  if (/\bLine\//i.test(navigator.userAgent)){
    const u = new URL(location.href); u.searchParams.set('openExternalBrowser','1');
    $('#lineLink').href = u.toString(); $('#lineTip').classList.remove('hide');
  }
  if (S.data && S.cfg.pin && S.cfg.user && S.cfg.api){
    go('home');
    loadInit().then(() => { if (S.view === 'home') render(); }).catch(() => toast('ใช้ข้อมูลที่เก็บไว้ในเครื่อง (ออฟไลน์)'));
    flush();
  } else go('login');
})();
</script>
</body>
</html>
